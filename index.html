<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>THE LAST ROOM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         GAME CANVAS
    ====================================================== -->

    <div id="gameContainer"></div>


    <!-- =====================================================
         CROSSHAIR
    ====================================================== -->

    <div id="crosshair">
        <span></span>
    </div>


    <!-- =====================================================
         START / LOADING SCREEN
    ====================================================== -->

    <div id="loadingScreen">

        <div id="startPanel">

            <h1>THE LAST ROOM</h1>

            <p class="subtitle">
                Something is waiting inside.
            </p>

            <button id="startButton">
                ENTER THE ROOM
            </button>

            <div class="controls-info">

                <p>
                    <strong>PC</strong>
                </p>

                <p>
                    W A S D — Move
                </p>

                <p>
                    Mouse — Look
                </p>

                <p>
                    E — Interact
                </p>

                <p>
                    F — Flashlight
                </p>

                <p>
                    SHIFT — Run
                </p>

            </div>

        </div>

    </div>


    <!-- =====================================================
         INTERACTION TEXT
    ====================================================== -->

    <div id="interactionText">
    </div>


    <!-- =====================================================
         MESSAGE BOX
    ====================================================== -->

    <div id="messageBox">
    </div>


    <!-- =====================================================
         FLASHLIGHT BATTERY
    ====================================================== -->

    <div id="batteryContainer">

        <div id="batteryLabel">
            FLASHLIGHT
        </div>

        <div id="batteryOuter">

            <div id="batteryInner"></div>

        </div>

        <div id="batteryPercent">
            100%
        </div>

    </div>


    <!-- =====================================================
         MOBILE CONTROLS
    ====================================================== -->

    <div id="mobileControls">


        <!-- ============================
             JOYSTICK
        ============================= -->

        <div id="joystick">

            <div id="joystickKnob"></div>

        </div>


        <!-- ============================
             MOBILE ACTION BUTTONS
        ============================= -->

        <div id="mobileButtons">

            <button
                id="flashlightButton"
                type="button"
            >
                🔦
            </button>


            <button
                id="interactButton"
                type="button"
            >
                E
            </button>


            <button
                id="sprintButton"
                type="button"
            >
                RUN
            </button>

        </div>

    </div>


    <!-- =====================================================
         WIN SCREEN
    ====================================================== -->

    <div id="winScreen">

        <div class="winPanel">

            <h1>YOU ESCAPED</h1>

            <p>
                The door finally opened.
            </p>

            <button
                id="restartButton"
                type="button"
            >
                PLAY AGAIN
            </button>

        </div>

    </div>


    <!-- =====================================================
         THREE.JS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
    </script>


    <!-- =====================================================
         GAME JAVASCRIPT
    ====================================================== -->

    <script src="game.js"></script>

</body>
</html>
