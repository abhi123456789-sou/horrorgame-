```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GUN GAME</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         GAME HUD
    ========================== -->

    <div id="hud">

        <div id="topHud">

            <div class="hudBox">
                HEALTH:
                <span id="health">100</span>
            </div>

            <div class="hudBox">
                KILLS:
                <span id="kills">0</span>
            </div>

            <div class="hudBox">
                AMMO:
                <span id="ammo">12</span>
                /
                <span id="reserve">120</span>
            </div>

        </div>


        <!-- Crosshair -->

        <div id="crosshair">
            +
        </div>


        <!-- Message -->

        <div id="message"></div>

    </div>


    <!-- =========================
         START MENU
    ========================== -->

    <div id="startMenu">

        <h1>GUN GAME</h1>

        <p>
            A simple 3D FPS
        </p>

        <div class="controls">

            <p>
                <b>W A S D</b> — Move
            </p>

            <p>
                <b>MOUSE</b> — Aim
            </p>

            <p>
                <b>LEFT CLICK</b> — Shoot
            </p>

            <p>
                <b>R</b> — Reload
            </p>

            <p>
                <b>SHIFT</b> — Sprint
            </p>

        </div>

        <button id="startButton">
            START GAME
        </button>

    </div>


    <!-- =========================
         GAME OVER
    ========================== -->

    <div id="gameOver" class="hidden">

        <h1>GAME OVER</h1>

        <p>
            KILLS:
            <span id="finalKills">0</span>
        </p>

        <button id="restartButton">
            PLAY AGAIN
        </button>

    </div>


    <!-- =========================
         THREE.JS GAME
    ========================== -->

    <script
        type="module"
        src="game.js"
    ></script>

</body>
</html>
```
