<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LAST ROOM</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            color: #d6d6d6;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            background:
                radial-gradient(
                    circle at center,
                    #242424 0%,
                    #111 35%,
                    #050505 75%
                );
        }

        /* Dark room effect */
        #darkness {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(
                    circle 180px at 50% 50%,
                    transparent 0%,
                    rgba(0, 0, 0, 0.25) 45%,
                    rgba(0, 0, 0, 0.92) 100%
                );
        }

        /* Room */
        #room {
            position: absolute;
            inset: 0;
            perspective: 700px;
        }

        #floor {
            position: absolute;
            width: 100%;
            height: 55%;
            bottom: 0;
            background:
                repeating-linear-gradient(
                    90deg,
                    #171717 0px,
                    #171717 80px,
                    #101010 81px,
                    #101010 82px
                );
            transform: perspective(500px) rotateX(35deg);
            transform-origin: bottom;
            border-top: 2px solid #292929;
        }

        #wall {
            position: absolute;
            width: 100%;
            height: 60%;
            top: 0;
            background:
                linear-gradient(
                    to bottom,
                    #191919,
                    #111
                );
        }

        /* Door */
        #door {
            position: absolute;
            width: 170px;
            height: 330px;
            left: 50%;
            top: 25%;
            transform: translateX(-50%);
            background: linear-gradient(
                90deg,
                #080808,
                #242424,
                #0a0a0a
            );
            border: 5px solid #080808;
            box-shadow:
                0 0 0 2px #292929,
                inset 0 0 30px #000,
                0 20px 50px rgba(0,0,0,0.8);
        }

        #door::after {
            content: "";
            position: absolute;
            right: 18px;
            top: 50%;
            width: 12px;
            height: 12px;
            background: #777;
            border-radius: 50%;
            box-shadow: 0 0 5px #aaa;
        }

        /* Message */
        #message {
            position: absolute;
            left: 50%;
            bottom: 55px;
            transform: translateX(-50%);
            text-align: center;
            color: #aaa;
            font-size: 15px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #000;
        }

        #message span {
            display: block;
            margin-top: 10px;
            color: #666;
            font-size: 12px;
        }

        /* Game title */
        #title {
            position: absolute;
            top: 30px;
            left: 35px;
            font-size: 18px;
            letter-spacing: 5px;
            color: #777;
        }

        /* Start screen */
        #startScreen {
            position: absolute;
            inset: 0;
            z-index: 10;
            background: #030303;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #startScreen h1 {
            font-size: 48px;
            letter-spacing: 12px;
            font-weight: normal;
            color: #ddd;
            margin-bottom: 20px;
        }

        #startScreen p {
            color: #555;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        #startButton {
            padding: 14px 35px;
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            cursor: pointer;
            letter-spacing: 3px;
            transition: 0.3s;
        }

        #startButton:hover {
            color: white;
            border-color: white;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        /* Subtle screen noise */
        #noise {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.035;
            z-index: 8;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    white 3px
                );
        }
    </style>
</head>

<body>

<div id="game">

    <div id="startScreen">
        <h1>THE LAST ROOM</h1>
        <p>AN EXPERIMENT IN PSYCHOLOGICAL HORROR</p>
        <button id="startButton">ENTER</button>
    </div>

    <div id="room">
        <div id="wall"></div>
        <div id="floor"></div>

        <div id="door"></div>

        <div id="darkness"></div>
    </div>

    <div id="title">THE LAST ROOM</div>

    <div id="message">
        The electricity is still working.
        <span>But nobody should be here.</span>
    </div>

    <div id="noise"></div>

</div>

<script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const message = document.getElementById("message");

    startButton.addEventListener("click", () => {
        startScreen.style.transition = "opacity 2s";
        startScreen.style.opacity = "0";

        setTimeout(() => {
            startScreen.style.display = "none";
        }, 2000);

        message.innerHTML =
            "The door is closed." +
            "<span>Press E to investigate.</span>";
    });

    document.addEventListener("keydown", (event) => {

        if (event.key.toLowerCase() === "e") {
            message.innerHTML =
                "You put your hand on the door." +
                "<span>It's colder than it should be.</span>";

            setTimeout(() => {
                message.innerHTML =
                    "Something is on the other side." +
                    "<span>Don't open it.</span>";
            }, 3500);
        }

    });
</script>

</body>
</html>
